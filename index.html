<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">

    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --link: #6cb0ff; --rule: #3d444d; }
  }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 1.1rem; margin: 32px 0 8px; padding-top: 16px; border-top: 1px solid var(--rule); }
  p, ul { margin: 0 0 12px; }
  ul { padding-left: 24px; }
  li { margin-bottom: 6px; }
  a { color: var(--link); overflow-wrap: anywhere; }
  .lead { color: var(--muted); }
</style>
</head>

<main>
